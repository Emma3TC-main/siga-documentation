ontext.</text></g><!--link IAM to AUD--><g id="link_IAM_AUD"><path d="M246.19,316.8382 C238.8,327.3082 231.85,339.3682 228,351.6982 C223.03,367.6282 223.3266,380.1222 226.5066,395.5222 " fill="none" id="IAM-to-AUD" style="stroke:#7F8C8D;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#7F8C8D" points="227.72,401.3982,229.8173,391.7753,226.7089,396.5015,221.9826,393.3931,227.72,401.3982" style="stroke:#7F8C8D;stroke-width:1.5;"/><text fill="#606F70" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="65" x="229" y="363.9541">eventos IAM</text></g><!--link CAT to INV--><g id="link_CAT_INV"><path d="M516.89,163.8882 C504.13,173.6582 491.79,185.3582 483,198.6982 C473.29,213.4282 469.2405,226.474 466.6605,242.554 " fill="none" id="CAT-to-INV" style="stroke:#7F8C8D;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#7F8C8D" points="465.71,248.4782,471.0853,240.2256,466.5021,243.5414,463.1863,238.9582,465.71,248.4782" style="stroke:#7F8C8D;stroke-width:1.5;"/><text fill="#606F70" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="155" x="484" y="210.9541">Product/Unit/Supplier events</text></g><!--link CAT to ANA--><g id="link_CAT_ANA"><path d="M620.64,163.8382 C632,173.8882 643.14,185.7382 651,198.6982 C687.35,258.5982 680.49,282.1482 689,351.6982 C689.81,358.3182 691.64,360.5782 689,366.6982 C683.35,379.8082 678.1338,387.4088 667.7938,397.3088 " fill="none" id="CAT-to-ANA" style="stroke:#7F8C8D;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#7F8C8D" points="663.46,401.4582,672.7271,398.1233,667.0715,398.0004,667.1945,392.3449,663.46,401.4582" style="stroke:#7F8C8D;stroke-width:1.5;"/><text fill="#606F70" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="81" x="686" y="287.4541">Product events</text></g><!--link INV to AUD--><g id="link_INV_AUD"><path d="M413.62,316.8382 C376.11,342.0082 329.7321,373.1347 292.2421,398.2947 " fill="none" id="INV-to-AUD" style="stroke:#7F8C8D;stroke-wi