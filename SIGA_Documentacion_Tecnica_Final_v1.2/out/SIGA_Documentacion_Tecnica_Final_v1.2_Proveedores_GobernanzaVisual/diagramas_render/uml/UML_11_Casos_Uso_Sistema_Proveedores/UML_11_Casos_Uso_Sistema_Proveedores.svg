<path d="M99,62.1211 L99,89.1211 M86,70.1211 L112,70.1211 M99,89.1211 L86,104.1211 M99,89.1211 L112,104.1211 " fill="none" filter="url(#fikc7f81tjzfl)" style="stroke:#E74C3C;stroke-width:0.5;"/><text fill="#922B21" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="136" x="31" y="122.6494">Encargado / Recepci&#243;n</text></g><g id="elem_GMN13"><path d="M652.5,273.1211 L652.5,293.7031 A12,12 0 0 0 664.5,305.7031 L863.5,305.7031 A12,12 0 0 0 875.5,293.7031 L875.5,271.1211 L865.5,261.1211 L664.5,261.1211 A12,12 0 0 0 652.5,273.1211 " fill="#FFF9C4" filter="url(#fikc7f81tjzfl)" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M865.5,261.1211 L865.5,265.1211 A6,6 0 0 0 871.5,271.1211 L875.5,271.1211 L865.5,261.1211 " fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:1.0;"/><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="202" x="658.5" y="280.1494">Mantiene el maestro b&#225;sico usado</text><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="171" x="658.5" y="297.4404">por las recepciones externas.</text></g><g id="elem_GMN16"><path d="M586,353.1211 L586,408.2852 A12,12 0 0 0 598,420.2852 L930,420.2852 A12,12 0 0 0 942,408.2852 L942,351.1211 L932,341.1211 L598,341.1211 A12,12 0 0 0 586,353.1211 " fill="#FFF9C4" filter="url(#fikc7f81tjzfl)" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M932,341.1211 L932,345.1211 A6,6 0 0 0 938,351.1211 L942,351.1211 L932,341.1211 " fill="#FFF9C4" style="stroke:#FBC02D;stroke-width:1.0;"/><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="304" x="592" y="360.1494">El proveedor externo no inicia sesi&#243;n ni opera SIGA.</text><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="290" x="592" y="377.4404">CUS-31 se agrega sin renumerar CUS-01..CUS-30.</text><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="335" x="592" y="394.7314">La relaci&#243;n entre CUS-31 y CUS-07 es de datos maestros,</text><text fill="#3E2723" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="254" x="592" y="412.0225">no un &#171;include&#187; entre ambos casos de uso.</text></g><!--link Admin to CUS31--><g id="link_Admin_CUS31"><path d="M140.78,200.6211 C171.39,200.6211 208.76,200.6211 248.94,200.6211 " fill="none" id="Admin-to-CUS31" style="stroke:#2C3E50;stroke-width:1.5;"/><polygon fill="#2C3E50" points="254.94,200.6211,245.94,196.6211,249.94,200.6211,245.94,204.6211,254.94,200.6211" style="stroke:#2C3E50;stroke-width:1.5;"/></g><!--link CatalogUser to CUS31--><g id="link_CatalogUser_CUS31"><path d="M190.92,275.5611 C229.76,258.4511 268.2694,241.4804 301.7894,226.7104 " fill="none" id="CatalogUser-to-CUS31" style="stroke:#2C3E50;stroke-width:1.5;"/><polygon fill="#2C3E50" points="307.28,224.2911,297.4312,224.2597,302.7045,226.3072,300.657,231.5805,307.28,224.2911" style="stroke:#2C3E50;stroke-width:1.5;"/></g><!--link Clerk to CUS07--><g id="link_Clerk_CUS07"><path d="M167.21,92.0611 C202.1,95.4011 238.9874,98.9288 275.5174,102.4288 " fill="none" id="Clerk-to-CUS07" style="stroke:#2C3E50;stroke-width:1.5;"/><polygon fill="#2C3E50" points="281.49,103.0011,272.9125,98.161,276.5128,102.5242,272.1495,106.1245,281.49,103.0011" style="stroke:#2C3E50;stroke-width:1.5;"/></g><!--link CUS07 to Validate--><g id="link_CUS07_Validate"><path d="M445.88,111.0311 C498.51,111.3011 561.8501,111.6103 622.2701,111.9203 " fill="none" id="CUS07-to-Validate" style="stroke:#2C3E50;stroke-width:1.5;stroke-dasharray:7.0,7.0;"/><polygon fill="#2C3E50" points="628.27,111.9511,619.2906,107.905,623.2701,111.9254,619.2496,115.9049,628.27,111.9511" style="stroke:#2C3E50;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="55" x="500" y="107.6494">&#171;include&#187;</text></g><!--link CUS31 to GMN13--><g id="link_CUS31_GMN13"><p